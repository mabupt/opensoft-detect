# OpenSoft Detect 内置 Semgrep 规则：Web 输入 → 危险 Sink 的污点追踪（taint mode）
# 覆盖面远大于纯 pattern：同一函数内的 request 取值经拼接/格式化到达危险 sink 即告警。
# 用于在真实项目里产生"有量的初筛发现"，再由模块3 LLM 研判与预过滤收敛误报。
rules:
  - id: python.taint.request-to-dangerous
    mode: taint
    languages: [python]
    severity: WARNING
    message: >-
      检测到外部输入（request）流向危险 sink（命令/代码执行、反序列化、SQL
      拼接等）而未经过滤。若输入可控，可能是注入漏洞；请交 LLM 误报研判。
    metadata:
      cwe: ["CWE-20", "CWE-78", "CWE-95", "CWE-502", "CWE-89"]
      category: security
      confidence: LOW
      technology: [flask, fastapi, django]
    pattern-sources:
      # --- Flask / Werkzeug ---
      - pattern: request.args.get(...)
      - pattern: request.args[...]
      - pattern: request.form.get(...)
      - pattern: request.form[...]
      - pattern: request.get_json()
      - pattern: request.json
      - pattern: request.cookies.get(...)
      # --- Django ---
      - pattern: request.GET.get(...)
      - pattern: request.GET[...]
      - pattern: request.POST.get(...)
      - pattern: request.POST[...]
      # --- FastAPI / Starlette ---
      - pattern: request.query_params.get(...)
      - pattern: request.query_params[...]
    pattern-sinks:
      # 命令/代码执行
      - pattern: eval($ARG)
      - pattern: exec($ARG)
      - pattern: compile($ARG, ...)
      # Pillow 表达式求值也是代码执行（如 pygoat a9_lab2: ImageMath.eval(request... 的 "function"）
      - pattern: ImageMath.eval($ARG)
      - pattern: ImageMath.eval($ARG, ...)
      # 通用属性 eval（防再出现 ImageMath 这类"裸 eval 之外"的变体）
      - pattern: $OBJ.eval($ARG)
      - pattern: $OBJ.eval($ARG, ...)
      - pattern: os.system($ARG)
      - pattern: os.popen($ARG)
      # SSRF：把用户可控 URL 交给网络请求库（pygoat playground/A6 与 views 用 requests）
      - pattern: requests.get($ARG, ...)
      - pattern: requests.post($ARG, ...)
      - pattern: requests.request(..., $ARG, ...)
      - pattern: urllib.request.urlopen($ARG, ...)
      - pattern: urlopen($ARG)
      - pattern: subprocess.run($CMD, shell=True)
      - pattern: subprocess.Popen($CMD, shell=True)
      - pattern: subprocess.call($CMD, shell=True)
      - pattern: subprocess.check_output($CMD, shell=True)
      # 反序列化
      - pattern: pickle.loads($ARG)
      - pattern: pickle.load($FILE)
      - pattern: yaml.load($ARG)
      # SQL：把 request 拼接进查询文本（参数化查询不会命中——SQL 字面量不"被污染"）
      - pattern: $OBJ.execute($SQL, ...)
      - pattern: $OBJ.executemany($SQL, ...)
      - pattern: $OBJ.executescript($SQL)
      - pattern: cursor.callproc($SQL, ...)

  # 补充：非 request 直接来源的常见高风险直接调用（便于在无完整 taint 上下文时兜底）
  - id: python.lang.security.audit.sql-fstring-execute
    languages: [python]
    severity: WARNING
    message: >-
      SQL 语句使用 f-string / 字符串拼接构造并传入 execute，若片段来自外部输入
      即 SQL 注入。应改用参数化查询（占位符 + 参数元组）。
    metadata:
      cwe: ["CWE-89"]
      category: security
      confidence: MEDIUM
    pattern-either:
      - pattern: $X.execute(f"...")
      - pattern: $X.executemany(f"...")
